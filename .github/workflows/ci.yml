name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          GOOS=darwin go vet $(go list -f '{{if not .CgoFiles}}{{.ImportPath}}{{end}}' ./... )
      - name: test
        run: go test -race -count=1 ./...
      - name: fuzz (short)
        run: |
          go test -run='^$' -fuzz=FuzzOpen -fuzztime=20s ./core/wire
          go test -run='^$' -fuzz=FuzzParsers -fuzztime=20s ./core/wire
      - name: cross-build
        run: |
          for t in windows/amd64 windows/arm64 linux/amd64 linux/arm64; do
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -trimpath -o /dev/null ./cmd/privatevpn
          done
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -o /dev/null ./mobile

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=1 go build -trimpath -o /dev/null ./cmd/privatevpn

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: sdk packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
      - name: core.aar
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          mkdir -p android/app/libs bin/gomobile
          go build -o bin/gomobile/gobind golang.org/x/mobile/cmd/gobind
          export PATH="$PWD/bin/gomobile:$PATH"
          go tool gomobile bind -target android/arm64,android/arm,android/amd64 -androidapi 26 \
            -javapkg app.privatevpn -trimpath -ldflags "-s -w" -o android/app/libs/core.aar ./mobile
      - name: assembleDebug
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
